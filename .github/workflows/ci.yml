name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Run tests
      run: mvn test
    
    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: inventory-package
        path: target/*.jar

  containerize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      # This set is to build and push to Docker Hub
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: docker.io/kaizencont/inventory
      REGISTRY_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
      REGISTRY_URL: docker.io


      # This set is to build and push to GitHub Container Registry
      # REGISTRY_URL: ghcr.io
      # REGISTRY_USER: ${{ github.actor }}
      # IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/inventory
      # REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: inventory-package
        path: target/

    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
          registry: ${{ env.REGISTRY_URL}}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
          buildkitd-flags: --debug

    # - name: Build and push Docker image
    #   id: build-and-push
    #   uses: docker/build-push-action@v6
    #   with:
    #     context: .
    #     push: true
    #     tags: |
    #       kaizencont/inventory:latest
    #       kaizencont/inventory:${{ github.sha }}
    #     cache-from: type=registry,ref=kaizencont/inventory:buildcache
    #     cache-to: type=registry,ref=kaizencont/inventory:buildcache,mode=max

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME}}:latest
          ${{ env.IMAGE_NAME}}:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME}}:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_NAME}}:buildcache,mode=max


    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.IMAGE_NAME}}:latest
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inventory-sbom
        path: sbom.spdx.json

    - name: Install cosign
      uses: sigstore/cosign-installer@v3.5.0

    # - name: Check cosign version
    #   run: cosign version

    - name: Sign the container image with cosign
      run: cosign sign --key env://COSIGN_KEY --yes ${{ env.IMAGE_NAME}}@${{ steps.build-and-push.outputs.digest }}
      env:
        COSIGN_KEY: ${{secrets.COSIGN_KEY}}
        COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}

    - name: Verify container image signature with cosign
      run: cosign verify --key env://COSIGN_PUB --certificate-identity-regexp '.*' --certificate-oidc-issuer-regexp '.*' ${{ env.IMAGE_NAME}}@${{ steps.build-and-push.outputs.digest }}
      env:
        COSIGN_PUB: ${{secrets.COSIGN_PUB}}
        
    - name: Attest
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.IMAGE_NAME}} 
        subject-digest: ${{ steps.build-and-push.outputs.digest }}
        push-to-registry: true